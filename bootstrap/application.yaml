apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gitops-spire
    app.kubernetes.io/managed-by: argocd

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: spire

  source:
    repoURL: https://spiffe.github.io/helm-charts-hardened/
    chart: spire
    targetRevision: 0.30.4

    helm:
      releaseName: spire
      values: |
        # Shared SPIRE configuration.
        # Keep these values consistent across Server and Agent.
        global:
          openshift: false
          spire:
            clusterName: k8s-poc
            trustDomain: myorg.local
            caSubject:
              country: SG
              organization: MyOrg
              commonName: myorg.local

        # SPIRE Server configuration
        spire-server:
          image:
            tag: "1.15.5"
          logLevel: info
          auditLogEnabled: true

          federation:
            enabled: false

          controllerManager:
            enabled: false

          persistence:
            type: pvc
            size: 1Gi

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # SPIRE Agent configuration
        spire-agent:
          image:
            tag: "1.15.5"
          logLevel: info

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

        # Optional components disabled for initial PoC.
        spiffe-oidc-discovery-provider:
          enabled: false

        tornjak-frontend:
          enabled: false

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
