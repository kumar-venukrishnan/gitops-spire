apiVersion: v1
kind: Pod
metadata:
  name: spire-mtls-client
  namespace: spire-demo
  labels:
    app: spire-mtls-client
spec:
  serviceAccountName: spire-client
  initContainers:
    - name: fetch-svid
      image: ghcr.io/spiffe/spire-agent:1.15.5
      command:
        - /opt/spire/bin/spire-agent
      args:
        - api
        - fetch
        - x509
        - -socketPath
        - /run/spire/sockets/spire-agent.sock
        - -write
        - /svid
      volumeMounts:
        - name: spiffe-workload-api
          mountPath: /run/spire/sockets
          readOnly: true
        - name: svid
          mountPath: /svid

  containers:
    - name: tls-client
      image: python:3.12-alpine
      command:
        - python
        - -u
        - -c
      args:
        - |
          import socket
          import ssl
          import time

          EXPECTED_SERVER_ID = "spiffe://myorg.local/ns/spire-demo/sa/spire-server"
          SERVER_ADDRESS = "spire-mtls-server.spire-demo.svc.cluster.local"
          SERVER_PORT = 8443

          context = ssl.create_default_context(
              ssl.Purpose.SERVER_AUTH,
              cafile="/svid/bundle.0.pem"
          )
          context.check_hostname = False
          context.verify_mode = ssl.CERT_REQUIRED
          context.load_cert_chain("/svid/svid.0.pem", "/svid/svid.0.key")

          print("SPIRE mTLS client started")
          print("Expected server SPIFFE ID:", EXPECTED_SERVER_ID)

          while True:
              try:
                  with socket.create_connection(
                      (SERVER_ADDRESS, SERVER_PORT), timeout=10
                  ) as raw:
                      with context.wrap_socket(
                          raw, server_hostname=SERVER_ADDRESS
                      ) as tls:

                          peer = tls.getpeercert()
                          uri_sans = [
                              value for kind, value in peer.get("subjectAltName", [])
                              if kind == "URI"
                          ]

                          print("Server SPIFFE identities:", uri_sans)

                          if EXPECTED_SERVER_ID not in uri_sans:
                              raise ssl.SSLError(
                                  "Server SPIFFE identity is not authorized"
                              )

                          print("SERVER IDENTITY VERIFIED")

                          tls.sendall(
                              b"GET / HTTP/1.1\r\n"
                              b"Host: spire-mtls-server\r\n"
                              b"Connection: close\r\n\r\n"
                          )

                          while True:
                              chunk = tls.recv(4096)
                              if not chunk:
                                  break
                              print(chunk.decode(errors="replace"), end="")

              except Exception as exc:
                  print("Connection or identity verification failed:", exc)

              print("\nRetrying in 10 seconds...")
              time.sleep(10)

      volumeMounts:
        - name: svid
          mountPath: /svid
          readOnly: true

  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
    - name: svid
      emptyDir: {}
