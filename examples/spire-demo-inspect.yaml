apiVersion: v1
kind: Pod
metadata:
  name: spire-demo-inspect
  namespace: spire-demo
spec:
  serviceAccountName: spire-demo
  restartPolicy: Always
  containers:
    - name: inspect
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
        - apk add --no-cache openssl && sleep 3600
      volumeMounts:
        - name: spiffe-workload-api
          mountPath: /run/spire/sockets
          readOnly: true
  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
