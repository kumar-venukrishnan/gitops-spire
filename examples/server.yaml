apiVersion: v1
kind: Service
metadata:
  name: spire-mtls-server
  namespace: spire-demo
spec:
  selector:
    app: spire-mtls-server
  ports:
    - name: tls
      port: 8443
      targetPort: 8443
  type: ClusterIP
---
apiVersion: v1
kind: Pod
metadata:
  name: spire-mtls-server
  namespace: spire-demo
  labels:
    app: spire-mtls-server
spec:
  serviceAccountName: spire-server
  initContainers:
    - name: fetch-svid
      image: ghcr.io/spiffe/spire-agent:1.15.5
      command:
        - /opt/spire/bin/spire-agent
      args:
        - api
        - fetch
        - x509
        - -socketPath
        - /run/spire/sockets/spire-agent.sock
        - -write
        - /svid
      volumeMounts:
        - name: spiffe-workload-api
          mountPath: /run/spire/sockets
          readOnly: true
        - name: svid
          mountPath: /svid
  containers:
    - name: tls-server
      image: python:3.12-alpine
      command:
        - python
        - -u
        - -c
      args:
        - |
          import socket
          import ssl

          EXPECTED_CLIENT_ID = "spiffe://myorg.local/ns/spire-demo/sa/spire-client"

          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain("/svid/svid.0.pem", "/svid/svid.0.key")
          context.load_verify_locations(cafile="/svid/bundle.0.pem")
          context.verify_mode = ssl.CERT_REQUIRED

          listener = socket.socket()
          listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          listener.bind(("0.0.0.0", 8443))
          listener.listen(20)

          print("SPIRE mTLS server listening on port 8443")
          print("Expected client SPIFFE ID:", EXPECTED_CLIENT_ID)

          while True:
              raw, address = listener.accept()
              try:
                  with context.wrap_socket(raw, server_side=True) as tls:
                      peer = tls.getpeercert()
                      uri_sans = [
                          value for kind, value in peer.get("subjectAltName", [])
                          if kind == "URI"
                      ]

                      print("Client SPIFFE identities:", uri_sans)

                      if EXPECTED_CLIENT_ID not in uri_sans:
                          print("REJECTED: unauthorized SPIFFE identity")
                          body = b"Identity not allowed"
                          tls.sendall(
                              b"HTTP/1.1 403 Forbidden\r\n"
                              b"Content-Length: " + str(len(body)).encode() +
                              b"\r\nConnection: close\r\n\r\n" + body
                          )
                          continue

                      print("ACCEPTED: authorized SPIFFE identity")
                      tls.recv(4096)

                      body = b"SPIFFE mTLS authentication successful"
                      tls.sendall(
                          b"HTTP/1.1 200 OK\r\n"
                          b"Content-Type: text/plain\r\n"
                          b"Content-Length: " + str(len(body)).encode() +
                          b"\r\nConnection: close\r\n\r\n" + body
                      )

              except ssl.SSLError as exc:
                  print("TLS handshake rejected:", exc)
              except Exception as exc:
                  print("Connection error:", exc)
              finally:
                  raw.close()

      ports:
        - containerPort: 8443
          name: tls
      volumeMounts:
        - name: svid
          mountPath: /svid
          readOnly: true
  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
    - name: svid
      emptyDir: {}
