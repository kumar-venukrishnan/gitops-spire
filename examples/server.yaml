apiVersion: v1
kind: Service
metadata:
  name: spire-mtls-server
  namespace: spire-demo
spec:
  selector:
    app: spire-mtls-server
  ports:
    - name: tls
      port: 8443
      targetPort: 8443
  type: ClusterIP
---
apiVersion: v1
kind: Pod
metadata:
  name: spire-mtls-server
  namespace: spire-demo
  labels:
    app: spire-mtls-server
spec:
  serviceAccountName: spire-server
  initContainers:
    - name: fetch-svid
      image: ghcr.io/spiffe/spire-agent:1.15.5
      command:
        - /opt/spire/bin/spire-agent
      args:
        - api
        - fetch
        - x509
        - -socketPath
        - /run/spire/sockets/spire-agent.sock
        - -write
        - /svid
      volumeMounts:
        - name: spiffe-workload-api
          mountPath: /run/spire/sockets
          readOnly: true
        - name: svid
          mountPath: /svid

  containers:
    - name: tls-server
      image: alpine:3.22
      command:
        - /bin/sh
        - -c
      args:
        - |
          apk add --no-cache openssl
          exec openssl s_server \
            -accept 8443 \
            -cert /svid/svid.0.pem \
            -key /svid/svid.0.key \
            -CAfile /svid/bundle.0.pem \
            -Verify 1 \
            -verify_return_error \
            -www
      ports:
        - containerPort: 8443
          name: tls
      volumeMounts:
        - name: svid
          mountPath: /svid
          readOnly: true

  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
    - name: svid
      emptyDir: {}
